name: build-configs

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build grouped configs
        run: python build.py
      - name: Commit results
        run: |
          git config user.name  "config-bot"
          git config user.email "bot@users.noreply.github.com"
          git add singbox.json sub.txt state.json
          git commit -m "update configs" || echo "no changes"
          git push
